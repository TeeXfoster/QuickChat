# GitHub Actions workflow – runs unit tests on every push / pull request
# Follows the automation approach shown in the brief video:
# https://youtu.be/oz0Qd5H4Onk

name: Java CI with Maven

on:
  push:
    branches: [ "main", "master", "feature/**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests with Maven
        run: mvn -B test

      - name: Build project
        run: mvn -B package -DskipTests
